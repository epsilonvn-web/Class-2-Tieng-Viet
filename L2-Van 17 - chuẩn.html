<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vườn Tri Thức Tiếng Việt Lớp 2 - Kết Nối Tri Thức</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #10B981;
      --secondary: #059669;
      --accent: #F59E0B;
      --dark: #1E293B;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ECFDF5 0%, #E0F2FE 40%, #FDF2F8 80%, #F3E8FF 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
      color: var(--dark);
    }
    .font-cute {
      font-family: 'Quicksand', cursive, sans-serif;
    }
    #app-container {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 1260px;
      height: 96vh;
      max-height: 900px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.16);
      border: 4px solid #FFFFFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card-hover {
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.07);
    }
    .btn-bounce:active {
      transform: scale(0.96);
    }
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: #CBD5E1;
      border-radius: 10px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .basket-drop {
      min-height: 125px;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- MÀN HÌNH BẬT ÂM THANH KHỞI ĐỘNG -->
    <div id="start-overlay" class="absolute inset-0 bg-gradient-to-br from-emerald-500/95 via-teal-500/95 to-cyan-600/95 z-50 flex flex-col items-center justify-center p-6 text-center text-white">
      <div class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center text-5xl shadow-2xl mb-4 transform -rotate-6 animate-bounce">
        📖
      </div>
      <h1 class="text-3xl md:text-5xl font-black font-cute mb-2 tracking-wide">🌿 TIẾNG VIỆT LỚP 2 🌿</h1>
      <p class="text-xs md:text-base font-bold max-w-lg mb-6 leading-relaxed text-emerald-100">
        Bộ sách "Kết Nối Tri Thức Với Cuộc Sống"<br>Giọng đọc Nữ Ban Mai chuẩn tiếng Việt truyền cảm! ✨
      </p>
      <button onclick="initAppAudio()" class="btn-bounce bg-amber-300 hover:bg-amber-200 text-amber-900 text-xl font-black px-8 py-3.5 rounded-full shadow-2xl border-4 border-white transition flex items-center space-x-2 cursor-pointer">
        <span>🔊 BẮT ĐẦU HỌC NGAY</span>
      </button>
    </div>

    <!-- HEADER ỨNG DỤNG -->
    <header class="bg-white/95 backdrop-blur-md px-4 py-2 flex justify-between items-center border-b-2 border-emerald-100 z-10 flex-shrink-0">
      <div class="flex items-center space-x-2">
        <button id="btn-back-menu" onclick="openVietMenu()" class="btn-bounce bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border-2 border-emerald-200 font-extrabold px-3 py-1 rounded-2xl text-xs md:text-sm flex items-center space-x-1 shadow-sm hidden cursor-pointer">
          <span>🏠 Menu Chính</span>
        </button>
        <!-- BADGE TAB CHỦ ĐỀ ĐƯỢC CHỌN -->
        <div id="topic-header-tab" class="bg-teal-50 border-2 border-teal-300 text-teal-800 font-black px-3 py-1 rounded-2xl text-xs md:text-sm shadow-xs hidden flex items-center gap-1.5">
          <span id="topic-header-title">Chủ đề</span>
        </div>
      </div>

      <div class="flex items-center justify-center">
        <h1 class="text-base sm:text-xl font-black font-cute text-emerald-600 tracking-wide drop-shadow-sm flex items-center gap-1.5 cursor-pointer" onclick="openVietMenu()">
          <span>📖</span>
          <span class="bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 bg-clip-text text-transparent">TIẾNG VIỆT LỚP 2</span>
          <span class="text-xs bg-pink-100 text-pink-600 font-extrabold px-2 py-0.5 rounded-full hidden sm:inline">KNTT</span>
        </h1>
      </div>

      <div class="flex items-center space-x-2">
        <div class="flex items-center space-x-1.5 bg-amber-50 border-2 border-amber-300 px-2.5 py-1 rounded-2xl shadow-inner">
          <span class="text-lg animate-spin" style="animation-duration: 6s;">⭐</span>
          <span id="stars-count" class="text-lg font-black text-amber-600">0</span>
          <span class="text-[11px] font-black text-amber-500 hidden sm:inline">Sao</span>
        </div>
        <button onclick="speakMascotCheer()" class="btn-bounce bg-emerald-100 hover:bg-emerald-200 text-emerald-700 border border-emerald-300 px-2.5 py-1 rounded-2xl text-xs font-black flex items-center space-x-1 shadow-sm cursor-pointer">
          <span>🐰 Cổ vũ</span>
        </button>
      </div>
    </header>

    <!-- NỘI DUNG CHÍNH (RENDER ĐỘNG VỪA KHUNG HÌNH) -->
    <main id="main-content" class="flex-1 p-2.5 sm:p-3.5 flex flex-col items-center justify-start text-center overflow-y-auto scrollbar-thin">
      <!-- Nội dung render tại đây -->
    </main>

  </div>

  <script>
    /* ==========================================================================
       HỆ THỐNG ÂM THANH & GIỌNG ĐỌC NỮ BAN MAI CHUẨN TIẾNG VIỆT
       ========================================================================== */
    let stars = parseInt(localStorage.getItem('stars_viet_lop2_v17') || '0');
    let audioCtx = null;
    let preferredVoice = null;
    let currentAudioInstance = null;
    let isReadingStory = false;
    let speechToken = 0;

    document.getElementById('stars-count').innerText = stars;

    // Thuật toán xáo trộn mảng ngẫu nhiên (Fisher-Yates)
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initVoiceSelection() {
      if (!('speechSynthesis' in window)) return;
      const setVoice = () => {
        const voices = window.speechSynthesis.getVoices();
        // LỌC CHẶN TRIỆT ĐỂ GIỌNG NAM, CHỈ CHỌN NỮ BAN MAI / THI GIANG / GOOGLE TIẾNG VIỆT
        preferredVoice = voices.find(v => (v.lang === 'vi-VN' || v.lang.includes('vi')) && (v.name.includes('Ban Mai') || v.name.includes('Thi Giang') || v.name.includes('Google Tiếng Việt') || v.name.includes('Google') || v.name.includes('HoaiMy') || v.name.includes('Female') || v.name.includes('Mai') || v.name.includes('Linh')))
                      || voices.find(v => (v.lang === 'vi-VN' || v.lang.includes('vi')) && !v.name.toLowerCase().includes('male') && !v.name.toLowerCase().includes('nam') && !v.name.toLowerCase().includes('minh') && !v.name.toLowerCase().includes('an') && !v.name.toLowerCase().includes('phong'))
                      || null;
      };
      setVoice();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = setVoice;
      }
    }

    function initAppAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      initVoiceSelection();
      playTone('correct');

      document.getElementById('start-overlay').style.display = 'none';
      openVietMenu();

      setTimeout(() => {
        speakBanMai("Chào bé yêu! Chúc con học thật vui và rinh thật nhiều ngôi sao nhé!");
      }, 300);
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          // 2 tiếng "bíp bíp" ngắn, rõ ràng báo hiệu chọn sai
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.01);
          gain.gain.setValueAtTime(0.22, now + 0.09);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
          gain.gain.setValueAtTime(0.001, now + 0.14);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.15);
          gain.gain.setValueAtTime(0.22, now + 0.23);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.1);
            g.gain.setValueAtTime(0.25, now + idx * 0.1);
            g.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
            o.connect(g);
            g.connect(audioCtx.destination);
            o.start(now + idx * 0.1);
            o.stop(now + idx * 0.1 + 0.25);
          });
        }
      } catch (e) {}
    }

    // NGẮT TỨC THÌ MỌI LUỒNG ÂM THANH ĐANG PHÁT DỞ
    function stopAllSpeech() {
      speechToken++;
      isReadingStory = false;
      if (currentAudioInstance) {
        currentAudioInstance.pause();
        currentAudioInstance.onended = null;
        currentAudioInstance.onerror = null;
        currentAudioInstance.src = "";
        currentAudioInstance = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      const readBtn = document.getElementById('btn-read-story-act');
      if (readBtn) readBtn.innerHTML = `<span>🔊 Đọc truyện</span>`;
    }

    // PHÁT ÂM CHUẨN GIỌNG NỮ CHỊ BAN MAI
    function speakBanMai(text, onEndCallback = null) {
      stopAllSpeech();
      const currentToken = speechToken;
      let cleanText = String(text || '').trim();
      if (!cleanText) {
        if (typeof onEndCallback === 'function') onEndCallback();
        return;
      }

      let done = false;
      const handleEnd = () => {
        if (!done && currentToken === speechToken) {
          done = true;
          if (typeof onEndCallback === 'function') onEndCallback();
        }
      };

      try {
        const encoded = encodeURIComponent(cleanText);
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encoded}`;
        const audio = new Audio(ttsUrl);
        currentAudioInstance = audio;
        audio.playbackRate = 0.95;

        audio.onended = () => {
          if (currentToken === speechToken) {
            currentAudioInstance = null;
            handleEnd();
          }
        };

        audio.onerror = () => {
          if (currentToken === speechToken) {
            currentAudioInstance = null;
            fallbackFemaleWebSpeech(cleanText, handleEnd, currentToken);
          }
        };

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            if (currentToken === speechToken) {
              fallbackFemaleWebSpeech(cleanText, handleEnd, currentToken);
            }
          });
        }
      } catch (e) {
        fallbackFemaleWebSpeech(cleanText, handleEnd, currentToken);
      }
    }

    function fallbackFemaleWebSpeech(cleanText, handleEnd, token) {
      if ('speechSynthesis' in window && token === speechToken) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = 0.92;
        utterance.pitch = 1.15;
        utterance.lang = 'vi-VN';
        if (preferredVoice) utterance.voice = preferredVoice;
        utterance.onend = () => { if (token === speechToken) handleEnd(); };
        utterance.onerror = () => { if (token === speechToken) handleEnd(); };
        window.speechSynthesis.speak(utterance);
      } else {
        handleEnd();
      }
    }

    // HỆ THỐNG ĐỌC TRUYỆN DÀI LIỀN MẠCH TUẦN TỰ
    function toggleReadStory(storyText, buttonId) {
      const btn = document.getElementById(buttonId);
      if (isReadingStory) {
        stopAllSpeech();
        return;
      }

      stopAllSpeech();
      let sentences = storyText.split(/(?<=[.!?\n])\s+/).map(s => s.trim()).filter(s => s.length > 0);
      if (sentences.length === 0) return;

      isReadingStory = true;
      if (btn) btn.innerHTML = `<span>⏹️ Dừng đọc</span>`;

      let index = 0;
      function playNextSentence() {
        if (!isReadingStory || index >= sentences.length) {
          stopAllSpeech();
          return;
        }

        const currentToken = speechToken;
        const curSentence = sentences[index];

        try {
          const encoded = encodeURIComponent(curSentence);
          const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encoded}`;
          const audio = new Audio(ttsUrl);
          currentAudioInstance = audio;
          audio.playbackRate = 0.95;

          audio.onended = () => {
            if (isReadingStory && currentToken === speechToken) {
              currentAudioInstance = null;
              index++;
              setTimeout(playNextSentence, 250);
            }
          };

          audio.onerror = () => {
            if (isReadingStory && currentToken === speechToken) {
              currentAudioInstance = null;
              fallbackWebSpeechSentence(curSentence, () => {
                if (isReadingStory && currentToken === speechToken) {
                  index++;
                  setTimeout(playNextSentence, 250);
                }
              }, currentToken);
            }
          };

          const p = audio.play();
          if (p !== undefined) {
            p.catch(() => {
              if (isReadingStory && currentToken === speechToken) {
                fallbackWebSpeechSentence(curSentence, () => {
                  if (isReadingStory && currentToken === speechToken) {
                    index++;
                    setTimeout(playNextSentence, 250);
                  }
                }, currentToken);
              }
            });
          }
        } catch(e) {
          if (isReadingStory && currentToken === speechToken) {
            fallbackWebSpeechSentence(curSentence, () => {
              if (isReadingStory && currentToken === speechToken) {
                index++;
                setTimeout(playNextSentence, 250);
              }
            }, currentToken);
          }
        }
      }

      playNextSentence();
    }

    function fallbackWebSpeechSentence(sentence, onSentenceEnd, token) {
      if ('speechSynthesis' in window && token === speechToken) {
        const utterance = new SpeechSynthesisUtterance(sentence);
        utterance.rate = 0.92;
        utterance.pitch = 1.15;
        utterance.lang = 'vi-VN';
        if (preferredVoice) utterance.voice = preferredVoice;
        utterance.onend = () => { if (token === speechToken) onSentenceEnd(); };
        utterance.onerror = () => { if (token === speechToken) onSentenceEnd(); };
        window.speechSynthesis.speak(utterance);
      } else {
        onSentenceEnd();
      }
    }

    function speakMascotCheer() {
      const cheers = [
        "Bé gái của ba mẹ chăm chỉ và thông minh quá!",
        "Mỗi câu hỏi là một bước tiến, con hãy suy nghĩ thật kĩ nhé!",
        "Thỏ Trắng chúc bé luôn vui vẻ và đạt điểm 10 môn Tiếng Việt!",
        "Con làm rất tốt, hãy tự tin khám phá bài học tiếp theo nhé!"
      ];
      speakBanMai(cheers[Math.floor(Math.random() * cheers.length)]);
    }

    function addStars(num) {
      stars += num;
      localStorage.setItem('stars_viet_lop2_v17', stars);
      document.getElementById('stars-count').innerText = stars;
      confetti({ particleCount: 50, spread: 70, origin: { y: 0.75 } });
    }

    const container = document.getElementById('main-content');
    const btnBackMenu = document.getElementById('btn-back-menu');
    const topicHeaderTab = document.getElementById('topic-header-tab');
    const topicHeaderTitle = document.getElementById('topic-header-title');

    function updateActiveTopicBadge(title) {
      if (title) {
        topicHeaderTitle.innerText = title;
        topicHeaderTab.classList.remove('hidden');
      } else {
        topicHeaderTab.classList.add('hidden');
      }
    }

    /* ==========================================================================
       MENU CHÍNH - 11 CHUYÊN MỤC
       ========================================================================== */
    function openVietMenu() {
      stopAllSpeech();
      btnBackMenu.classList.add('hidden');
      updateActiveTopicBadge(null);

      container.innerHTML = `
        <div class="mb-2.5 text-center">
          <div class="inline-flex items-center gap-2 bg-emerald-100 text-emerald-800 px-4 py-1 rounded-full text-xs md:text-sm font-extrabold mb-1 shadow-sm">
            🌸 TIẾNG VIỆT LỚP 2 - BỘ SÁCH KẾT NỐI TRI THỨC VỚI CUỘC SỐNG 🌸
          </div>
          <h2 class="text-xl md:text-2xl lg:text-3xl font-black text-emerald-700 font-cute">CHỌN CHỦ ĐỀ LUYỆN TẬP</h2>
          <p class="text-xs md:text-sm font-bold text-gray-500 mt-0.5">Bé hãy chọn một chủ đề bên dưới để khám phá tri thức nhé!</p>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2.5 w-full max-w-6xl pb-2">
          
          <div onclick="openTopicQuestionGame('vietWordTypes', '1. Phân Loại Từ Ngữ')" class="card-hover bg-gradient-to-br from-emerald-50 to-teal-50 border-2 border-emerald-200 hover:border-emerald-400 rounded-3xl p-3 text-center cursor-pointer shadow-sm flex flex-col items-center justify-between min-h-[145px]">
            <div class="text-3xl mb-1">📦</div>
            <h3 class="text-xs sm:text-sm font-black text-emerald-800 leading-snug">1. Phân Loại Từ Ngữ</h3>
            <p class="text-[11px] font-semibold text-emerald-600 mt-0.5">Sự vật • Hoạt động • Đặc điểm</p>
            <span class="mt-1.5 text-[10px] font-extrabold bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full">50+ câu hỏi</span>
          </div>

          <div onclick="startSortingBasketGame('2. Thu Hoạch Vào Giỏ')" class="card-hover bg-gradient-to-br from-teal-50 to-cyan-50 border-2 border-teal-200 hover:border-teal-400 rounded-3xl p-3 text-center cursor-pointer shadow-sm flex flex-col items-center justify-between min-h-[145px]">
            <div class="text-3xl mb-1">🧺</div>
            <h3 class="text-xs sm:text-sm font-black text-teal-800 leading-snug">2. Thu Hoạch Vào Giỏ</h3>
            <p class="text-[11px] font-semibold text-teal-600 mt-0.5">Phân loại tương tác SGK</p>
            <span class="mt-1.5 text-[10px] font-extrabold bg-teal-200 text-teal-800 px-2 py-0.5 rounded-full">12 bài tập lớn</span>
          </div>

          <div onclick="openTopicQuestionGame('vietSentenceModel', '3. Ba Kiểu Câu Cơ Bản')" class="card-hover bg-gradient-to-br from-indigo-50 to-blue-50 border-2 border-indigo-200 hover:border-indigo-400 rounded-3xl p-3 text-center cursor-pointer shadow-sm flex flex-col items-center justify-between min-h-[145px]">
            <div class="text-3xl mb-1">👧</div>
            <h3 class="text-xs sm:text-sm font-black text-indigo-800 leading-snug">3. Ba Kiểu Câu Cơ Bản</h3>
            <p class="text-[11px] font-semibold text-indigo-600 mt-0.5">Ai là gì? • Làm gì? • Thế nào?</p>
            <span class="mt-1.5 text-[10px] font-extrabold bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded-full">50+ câu hỏi</span>
          </div>

          <div onclick="openTopicQuestionGame('vietSpelling', '4. Vua Chính Tả Lớp 2')" class="card-hover bg-gradient-to-br from-green-50 to-emerald-50 border-2 border-green-200 hover:border-green-400 rounded-3xl p-3 text-center cursor-pointer shadow-sm flex flex-col items-center justify-between min-h-[145px]">
            <div class="text-3xl mb-1">✏️</div>
            <h3 class="text-xs sm:text-sm font-black text-green-800 leading-snug">4. Vua Chính Tả Lớp 2</h3>
            <p class="text-[11px] font-semibold text-green-600 mt-0.5">c/k, g/gh, ng/ngh, ch/tr...</p>
            <span class="mt-1.5 text-[10px] font-extrabold bg-green-200 text-green-800 px-2 py-0.5 rounded-full">50+ câu hỏi</span>
          </div>

          <div onclick="openTopicQuestionGame('vietPunctuation', '5. Dấu Câu Thông Minh')" class="card-hover bg-gradient-to-br from-cyan-50 to-sky-50 border-2 border-cyan-200 hover:border-cyan-400 rounded-3xl p-3 text-center cursor-pointer shadow-sm flex flex-col items-center justify-between min-h-[145px]">

        ...s,
        shuffledChoices1: shuffleArray(s.q1.choices),
        shuffledChoices2: shuffleArray(s.q2.choices)

      currentStoryIdx = 0;
      storyUserAnswers = {};
      lastSpokenStoryIndex = -1;
      renderStoryReadingView();
    }

      if (lastSpokenStoryIndex !== currentStoryIdx) {
        lastSpokenStoryIndex = currentStoryIdx;
        speakBanMai(s.q1.text, () => speakBanMai(s.q2.text));
      }
    }

    function submitStoryChoice(qNum, selected) {
      const s = randomizedStories[currentStoryIdx];
      const qObj = (qNum === 1) ? s.q1 : s.q2;
      const key = `${currentStoryIdx}_q${qNum}`;
      const isAlreadyCorrect = storyUserAnswers[key] && storyUserAnswers[key].isCorrect;
      const isCorrect = (selected === qObj.answer);

      storyUserAnswers[key] = {
        selected: selected,
        isCorrect: isCorrect
      };

      if (isCorrect) {
        if (!isAlreadyCorrect) addStars(1);
        speakBanMai(String(selected));
      } else {
        playTone('wrong');
      }

      renderStoryReadingView();
    }

    function prevStoryLesson() {
      stopAllSpeech();
      if (currentStoryIdx > 0) {
        currentStoryIdx--;
        renderStoryReadingView();
      }
    }

    function nextStoryLesson() {
      stopAllSpeech();
      if (currentStoryIdx < randomizedStories.length - 1) {
        currentStoryIdx++;
        renderStoryReadingView();
      }
    }

    /* ==========================================================================
       BỘ ĐIỀU KHIỂN TRẮC NGHIỆM VỚI THỨ TỰ CỐ ĐỊNH ỔN ĐỊNH
       ========================================================================== */
    let currentTopicQuestions = [];
    let currentTopicQIndex = 0;
    let topicUserAnswers = {};
    let activeTopicName = "";
    // Các mục được TỰ ĐỘNG ĐỌC câu hỏi ngay khi mở/chuyển câu: 1, 3, 8, 12
    const AUTO_READ_TOPIC_KEYS = ['vietWordTypes', 'vietSentenceModel', 'vietVocabulary', 'vietRiddles'];
    let topicAutoReadEnabled = false;
    let lastSpokenTopicIndex = -1;

    function openTopicQuestionGame(typeKey, badgeTitle) {
      stopAllSpeech();
      btnBackMenu.classList.remove('hidden');
      updateActiveTopicBadge(badgeTitle);
      activeTopicName = badgeTitle;

      let rawPool = VIET_WORD_TYPES_DATA;
      if (typeKey === 'vietWordTypes') rawPool = VIET_WORD_TYPES_DATA;
      else if (typeKey === 'vietSentenceModel') rawPool = VIET_SENTENCE_DATA;
      else if (typeKey === 'vietSpelling') rawPool = VIET_SPELLING_DATA;
      else if (typeKey === 'vietPunctuation') rawPool = VIET_PUNCTUATION_DATA;
      else if (typeKey === 'vietVocabulary') rawPool = VOCAB_DATA;
      else if (typeKey === 'vietIdiom') rawPool = IDIOM_DATA;
      else if (typeKey === 'vietRiddles') rawPool = VIET_RIDDLE_DATA;

      currentTopicQuestions = shuffleArray(rawPool).map(q => ({
        ...q,
        shuffledChoices: shuffleArray(q.choices)
      }));
      currentTopicQIndex = 0;
      topicUserAnswers = {};
      topicAutoReadEnabled = AUTO_READ_TOPIC_KEYS.includes(typeKey);
      lastSpokenTopicIndex = -1;
      renderTopicQuestionView();
    }

    function renderTopicQuestionView() {
      const total = currentTopicQuestions.length;
      const q = currentTopicQuestions[currentTopicQIndex];
      const answered = topicUserAnswers[currentTopicQIndex] || null;
      const fixedChoices = q.shuffledChoices;

      container.innerHTML = `
        <div class="w-full max-w-2xl mb-1.5 flex items-center justify-between">
          <span class="bg-emerald-100 text-emerald-900 text-xs md:text-sm font-black px-3.5 py-1 rounded-full uppercase">${activeTopicName}</span>
          <span class="bg-amber-100 text-amber-900 text-xs md:text-sm font-black px-3.5 py-1 rounded-full">Câu: ${currentTopicQIndex + 1} / ${total}</span>
        </div>

        <div class="w-full max-w-2xl mb-3">
          <h2 class="text-base sm:text-lg md:text-xl font-black text-gray-800 flex items-center justify-center gap-2">

            <button class="btn-bounce bg-emerald-100 hover:bg-emerald-200 text-emerald-700 text-xs font-bold px-2 py-1 rounded-xl shadow-xs cursor-pointer" onclick="speakBanMai('${q.question.replace(/'/g, "")}')">
              🔊

          </h2>
          ${q.note ? `<p class="text-xs font-bold text-teal-600 mt-1">💡 ${q.note}</p>` : ''}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-2xl mb-3.5">
          ${fixedChoices.map((c, idx) => {
            let extra = "bg-white border-2 border-emerald-300 hover:bg-emerald-50 text-emerald-950 cursor-pointer";
            if (answered) {
              if (answered.isCorrect && c === q.answer) {
                extra = "!bg-emerald-500 !text-white !border-emerald-600 shadow-md font-black";
              } else if (!answered.isCorrect && c === answered.selected) {
                extra = "!bg-rose-500 !text-white !border-rose-600 shadow-md";
              }
            }
            return `
              <button onclick="handleTopicChoice('${c.replace(/'/g, "\\'")}')" class="btn-bounce font-bold text-sm sm:text-base md:text-[16px] p-3.5 rounded-2xl border-2 transition shadow-xs text-left flex items-start gap-2 ${extra}">
                <span class="font-black ${answered && answered.isCorrect && c === q.answer ? 'text-white' : 'text-emerald-700'}">${String.fromCharCode(65 + idx)}.</span>
                <span>${c}</span>
              </button>
            `;
          }).join('')}

      if (topicAutoReadEnabled && lastSpokenTopicIndex !== currentTopicQIndex) {
        lastSpokenTopicIndex = currentTopicQIndex;
        speakBanMai(q.question);
      }
    }

    function handleTopicChoice(selected) {
      const q = currentTopicQuestions[currentTopicQIndex];
      const isAlreadyCorrect = topicUserAnswers[currentTopicQIndex] && topicUserAnswers[currentTopicQIndex].isCorrect;
      const isCorrect = (selected === q.answer);

      topicUserAnswers[currentTopicQIndex] = {
        selected: selected,
        isCorrect: isCorrect
      };

      if (isCorrect) {
        if (!isAlreadyCorrect) addStars(1);
        speakBanMai(String(selected));
      } else {
        playTone('wrong');
      }

      renderTopicQuestionView();
    }

      stopAllSpeech();
      if (currentTopicQIndex > 0) {
        currentTopicQIndex--;
        renderTopicQuestionView();
      }

      if (currentTopicQIndex < currentTopicQuestions.length - 1) {

        sample: "Em có một chú gấu bông rất đáng yêu do bà ngoại tặng. Chú gấu có bộ lông màu nâu mềm mại và đôi mắt đen tròn xoe. Tối nào em cũng ôm gấu bông đi ngủ. Em rất yêu quý món quà này của bà."
      },
      {
        title: "Kể việc người thân đã làm cho em (Tuần 14)",
        prompt: "Viết 3 - 4 câu kể về một việc người thân đã làm cho em.",
        tips: ["Người đó là ai?", "Người đó đã làm gì cho em?", "Em cảm thấy thế nào về việc làm đó?"],
        sample: "Tối qua, mẹ đã thức khuya để vá lại chiếc áo bị rách của em. Mẹ khâu từng đường kim thật cẩn thận. Sáng hôm sau, em mặc chiếc áo lành lặn đến trường. Em thầm cảm ơn mẹ rất nhiều."
      },
      {
        title: "Kể việc em đã làm cùng người thân (Tuần 16)",
        prompt: "Viết 3 - 4 câu kể về một việc em đã làm cùng ông, bà hoặc người thân.",
        tips: ["Em đã làm việc gì cùng ai?", "Hai người đã làm việc đó như thế nào?", "Em cảm thấy thế nào sau khi làm xong?"],
        sample: "Chủ nhật vừa qua, em cùng ông tưới nước cho vườn rau sau nhà. Ông chỉ cho em cách tưới sao cho cây không bị úng nước. Nhìn những luống rau xanh tốt, em thấy rất vui và tự hào."
      },
      {
        title: "Giới thiệu một đồ dùng học tập (Tuần 18)",
        prompt: "Viết 3 - 4 câu giới thiệu về một đồ dùng học tập của em.",
        tips: ["Đó là đồ dùng gì? Có màu sắc, hình dáng ra sao?", "Đồ dùng đó dùng để làm gì?", "Em giữ gìn đồ dùng đó như thế nào?"],
        sample: "Chiếc hộp bút của em có màu xanh da trời rất đẹp. Bên trong hộp có bút chì, bút mực và cục tẩy. Chiếc hộp giúp em cất giữ đồ dùng học tập gọn gàng. Em luôn giữ gìn nó cẩn thận."
      },
      {
        title: "Kể lại một sự việc em đã chứng kiến hoặc tham gia (Tuần 22)",
        prompt: "Viết 3 - 4 câu kể lại một sự việc em đã chứng kiến hoặc tham gia ở trường, ở nhà.",
        tips: ["Sự việc đó diễn ra ở đâu, khi nào?", "Những ai có mặt trong sự việc đó?", "Sự việc diễn ra như thế nào? Kết quả ra sao?"],
        sample: "Tuần trước, cả lớp em cùng nhau trồng một cây bàng nhỏ ở góc sân trường. Bạn Nam đào hố, bạn Hoa đặt cây, còn em thì tưới nước. Nhìn cây con đứng vững, cả lớp reo lên vui sướng."
      },
      {
        title: "Kể việc làm để bảo vệ môi trường (Tuần 26)",
        prompt: "Viết 3 - 4 câu kể về một việc em đã làm để bảo vệ môi trường.",
        tips: ["Em đã làm việc gì để bảo vệ môi trường?", "Em làm việc đó ở đâu, khi nào?", "Việc làm đó có ý nghĩa gì?"],
        sample: "Sáng chủ nhật, em cùng các bạn trong xóm nhặt rác ở bờ sông gần nhà. Chúng em phân loại rác và bỏ đúng nơi quy định. Dòng sông trở nên sạch đẹp hơn. Em cảm thấy rất vui vì đã góp một phần nhỏ bảo vệ môi trường."
      },
      {
        title: "Kể về công việc của người thân (Tuần 34)",
        prompt: "Viết 3 - 4 câu kể về công việc của một người thân trong gia đình em.",
        tips: ["Người đó làm nghề gì?", "Công việc đó diễn ra như thế nào?", "Em cảm thấy thế nào về công việc của người thân?"],
        sample: "Bố em là một bác sĩ. Hằng ngày, bố đến bệnh viện khám và chữa bệnh cho mọi người. Có hôm bố về nhà rất muộn vì phải cấp cứu bệnh nhân. Em rất tự hào về công việc của bố."
      }
    ];

    let currentWritingIndex = 0;
    let randomizedWritingPrompts = [];

    function openWritingPrompts(badgeTitle) {
      stopAllSpeech();
      btnBackMenu.classList.remove('hidden');
      updateActiveTopicBadge(badgeTitle);
      randomizedWritingPrompts = shuffleArray(WRITING_PROMPTS);
      currentWritingIndex = 0;
      renderWritingView();
    }

    function renderWritingView() {
      const total = randomizedWritingPrompts.length;
      const w = randomizedWritingPrompts[currentWritingIndex];
      container.innerHTML = `
        <div class="w-full max-w-3xl mb-2 flex items-center justify-between">
          <span class="bg-orange-100 text-orange-900 text-xs md:text-sm font-black px-3.5 py-1 rounded-full uppercase">✍️ LUYỆN VIẾT ĐOẠN VĂN</span>
          <span class="bg-amber-100 text-amber-900 text-xs md:text-sm font-black px-3.5 py-1 rounded-full">Chủ đề: ${currentWritingIndex + 1} / ${total}</span>
        </div>

        <div class="w-full max-w-3xl bg-white border-2 border-orange-300 rounded-3xl p-4 md:p-5 shadow-sm text-left">
          <h2 class="text-lg md:text-xl font-black text-orange-800 mb-1.5 flex items-center gap-2">
            <span>${w.title}</span>
            <button class="btn-bounce bg-orange-100 hover:bg-orange-200 text-orange-700 text-sm font-bold px-2.5 py-0.5 rounded-lg shadow-xs cursor-pointer" onclick="speakBanMai('${w.prompt.replace(/'/g, "")}')">🔊</button>
          </h2>
          <p class="text-sm md:text-base font-bold text-gray-800 mb-2.5">${w.prompt}</p>

          <div class="bg-amber-50 border border-dashed border-amber-300 rounded-2xl p-3 mb-2.5">
            <p class="text-sm font-black text-amber-800 mb-1">💡 Gợi ý:</p>
            <ul class="list-disc list-inside space-y-1">
              ${w.tips.map(t => `<li class="text-xs md:text-sm font-bold text-gray-700">${t}</li>`).join('')}
            </ul>
          </div>

          <div class="bg-emerald-50 border border-emerald-300 rounded-2xl p-3">
            <div class="flex items-center justify-between mb-1">
              <p class="text-sm font-black text-emerald-800">📝 Đoạn văn mẫu:</p>
              <button class="btn-bounce bg-emerald-100 hover:bg-emerald-200 text-emerald-700 text-xs font-black px-3 py-1 rounded-lg shadow-xs cursor-pointer" onclick="speakBanMai('${w.sample.replace(/'/g, "")}')">🔊 Đọc mẫu</button>
            </div>
            <p class="text-sm md:text-[15.5px] font-bold text-gray-800 leading-relaxed">${w.sample}</p>
          </div>
        </div>

        <div class="flex items-center justify-between gap-4 w-full max-w-3xl pt-2 mt-2 border-t-2 border-gray-100">
          <button onclick="prevWritingPrompt()" ${currentWritingIndex === 0 ? 'disabled' : ''} class="btn-bounce flex-1 bg-amber-400 hover:bg-amber-300 disabled:opacity-30 disabled:cursor-not-allowed text-amber-950 font-black text-xs sm:text-sm py-2 px-4 rounded-xl shadow-sm cursor-pointer">
            <span>⬅️ Chủ đề trước</span>
          </button>
          <button onclick="nextWritingPrompt()" ${currentWritingIndex === total - 1 ? 'disabled' : ''} class="btn-bounce flex-1 bg-orange-500 hover:bg-orange-400 disabled:opacity-30 disabled:cursor-not-allowed text-white font-black text-xs sm:text-sm py-2 px-4 rounded-xl shadow-sm cursor-pointer">
            <span>Chủ đề sau ➡️</span>
          </button>
        </div>
      `;
    }

    function prevWritingPrompt() {
      stopAllSpeech();
      if (currentWritingIndex > 0) {
        currentWritingIndex--;
        renderWritingView();
      }
    }

    function nextWritingPrompt() {
      stopAllSpeech();
      if (currentWritingIndex < randomizedWritingPrompts.length - 1) {
        currentWritingIndex++;
        renderWritingView();
      }
    }

    /* ==========================================================================
       PHẦN 10: ĐẤU TRƯỜNG TRẠNG NGUYÊN
       ========================================================================== */
    let championQuestions = [];
    let championCurrentIndex = 0;
    let championUserAnswers = {};

    function startChampionQuizGame(badgeTitle) {
      stopAllSpeech();
      btnBackMenu.classList.remove('hidden');
      updateActiveTopicBadge(badgeTitle);

      const masterPool = [
        ...VIET_WORD_TYPES_DATA,
        ...VIET_SENTENCE_DATA,
        ...VIET_SPELLING_DATA,
        ...VIET_PUNCTUATION_DATA,
        ...VOCAB_DATA,
        ...IDIOM_DATA
      ];

      championQuestions = shuffleArray(masterPool).slice(0, 15).map(q => ({
        ...q,
        shuffledChoices: shuffleArray(q.choices)
      }));
      championCurrentIndex = 0;
      championUserAnswers = {};
      renderChampionView();
    }

    function renderChampionView() {
      const total = championQuestions.length;
      const q = championQuestions[championCurrentIndex];
      const answered = championUserAnswers[championCurrentIndex] || null;
      const fixedChoices = q.shuffledChoices;

      container.innerHTML = `
        <div class="w-full max-w-2xl mb-1.5 flex items-center justify-between">
          <span class="bg-pink-100 text-pink-900 text-xs md:text-sm font-black px-3.5 py-1 rounded-full uppercase">👑 ĐẤU TRƯỜNG TRẠNG NGUYÊN</span>
          <span class="bg-amber-100 text-amber-900 text-xs md:text-sm font-black px-3.5 py-1 rounded-full">Câu: ${championCurrentIndex + 1} / ${total}</span>
        </div>

        <div class="w-full max-w-2xl mb-3">
          <h2 class="text-base sm:text-lg md:text-xl font-black text-gray-800 flex items-center justify-center gap-2">
            <span>${q.question}</span>
            <button class="btn-bounce bg-pink-100 hover:bg-pink-200 text-pink-700 text-xs font-bold px-2 py-1 rounded-xl shadow-xs cursor-pointer" onclick="speakBanMai('${q.question.replace(/'/g, "")}')">
              🔊
            </button>
          </h2>
        </div>

        <!-- 4 LỰA CHỌN ĐÃ XÁO TRỘN NGẪU NHIÊN -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-2xl mb-3.5">
          ${fixedChoices.map((c, idx) => {
            let extra = "bg-white border-2 border-pink-300 hover:bg-pink-50 text-pink-950 cursor-pointer";
            if (answered) {
              if (answered.isCorrect && c === q.answer) {
                extra = "!bg-emerald-500 !text-white !border-emerald-600 shadow-md font-black";
              } else if (!answered.isCorrect && c === answered.selected) {
                extra = "!bg-rose-500 !text-white !border-rose-600 shadow-md";
              }
            }
            return `
              <button onclick="handleChampionChoice('${c.replace(/'/g, "\\'")}')" class="btn-bounce font-bold text-sm sm:text-base md:text-[16px] p-3.5 rounded-2xl border-2 transition shadow-xs text-left flex items-start gap-2 ${extra}">
                <span class="font-black ${answered && answered.isCorrect && c === q.answer ? 'text-white' : 'text-pink-700'}">${String.fromCharCode(65 + idx)}.</span>
                <span>${c}</span>
              </button>
            `;
          }).join('')}
        </div>

        <div class="flex items-center justify-between gap-4 w-full max-w-md pt-1.5 border-t-2 border-gray-100">
          <button onclick="prevChampionQ()" ${championCurrentIndex === 0 ? 'disabled' : ''} class="btn-bounce flex-1 bg-amber-400 hover:bg-amber-300 disabled:opacity-30 disabled:cursor-not-allowed text-amber-950 font-black text-xs sm:text-sm py-2.5 px-3 rounded-xl shadow-sm cursor-pointer">
            <span>⬅️ Câu trước</span>
          </button>
          
          ${championCurrentIndex === total - 1 ? `
            <button onclick="finishChampionQuiz()" class="btn-bounce flex-1 bg-pink-600 hover:bg-pink-500 text-white font-black text-xs sm:text-sm py-2.5 px-3 rounded-xl shadow-sm animate-pulse cursor-pointer">
              <span>🏆 Nộp bài thi</span>
            </button>
          ` : `
            <button onclick="nextChampionQ()" class="btn-bounce flex-1 bg-pink-500 hover:bg-pink-400 text-white font-black text-xs sm:text-sm py-2.5 px-3 rounded-xl shadow-sm cursor-pointer">
              <span>Câu sau ➡️</span>
            </button>
          `}
        </div>
      `;
    }

    function handleChampionChoice(selected) {
      const q = championQuestions[championCurrentIndex];
      const isAlreadyCorrect = championUserAnswers[championCurrentIndex] && championUserAnswers[championCurrentIndex].isCorrect;
      const isCorrect = (selected === q.answer);

      championUserAnswers[championCurrentIndex] = {
        selected: selected,
        isCorrect: isCorrect
      };

      if (isCorrect) {
        if (!isAlreadyCorrect) addStars(1);
        speakBanMai(String(selected));
      } else {
        playTone('wrong');
      }

      renderChampionView();
    }

    function prevChampionQ() {
      stopAllSpeech();
      if (championCurrentIndex > 0) {
        championCurrentIndex--;
        renderChampionView();
      }
    }

    function nextChampionQ() {
      stopAllSpeech();
      if (championCurrentIndex < championQuestions.length - 1) {
        championCurrentIndex++;
        renderChampionView();
      }
    }

    function finishChampionQuiz() {
      stopAllSpeech();
      let correctCount = 0;
      championQuestions.forEach((q, idx) => {
        if (championUserAnswers[idx] && championUserAnswers[idx].isCorrect) {
          correctCount++;
        }
      });

      playTone('fanfare');
      const bonus = correctCount * 2;
      addStars(bonus);
      speakBanMai(`Chúc mừng Trạng Nguyên nhí đã đạt ${correctCount} trên ${championQuestions.length} câu đúng!`);

      container.innerHTML = `
        <div class="bg-white border-4 border-pink-400 rounded-3xl p-6 max-w-md mx-auto text-center shadow-xl">
          <div class="text-6xl mb-2 animate-bounce">👑 📜 ⭐</div>
          <h3 class="text-xl md:text-2xl font-black text-pink-700 font-cute">BẢNG VINH DANH TRẠNG NGUYÊN</h3>
          <p class="text-xs font-extrabold text-gray-700 mt-1">Bé yêu xuất sắc môn Tiếng Việt Lớp 2</p>

          <div class="my-3.5 p-3 bg-gradient-to-r from-amber-50 to-pink-50 border-2 border-dashed border-pink-300 rounded-2xl">
            <p class="text-2xl font-black text-amber-600">${correctCount} / ${championQuestions.length} ĐIỂM</p>
            <p class="text-[11px] font-bold text-gray-600 mt-0.5">Thưởng: +${bonus} Ngôi Sao ⭐</p>
          </div>

          <div class="flex gap-2.5 justify-center">
            <button onclick="startChampionQuizGame('10. Trạng Nguyên Nhí')" class="btn-bounce bg-pink-500 hover:bg-pink-600 text-white font-black text-xs px-4 py-2 rounded-xl shadow-sm cursor-pointer">
              🔄 Đề mới
            </button>
            <button onclick="openVietMenu()" class="btn-bounce bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xs px-4 py-2 rounded-xl shadow-sm cursor-pointer">
              🏠 Menu chính
            </button>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
